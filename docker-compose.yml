# Local demo / development stack. Production hardening is a later phase (see docs/ROADMAP.md).
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-onegov}
      POSTGRES_USER: ${POSTGRES_USER:-onegov}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-onegov};Username=${POSTGRES_USER:-onegov};Password=${POSTGRES_PASSWORD}"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-}
      NationalId__Provider: ${NATIONAL_ID_PROVIDER:-none}
      NationalId__RedirectUri: ${WEB_PUBLIC_URL:-http://localhost:8080}/auth/national-id/callback
      Cors__AllowedOrigins__0: http://localhost:${WEB_PORT:-8080}
      Database__ApplyMigrationsOnStartup: "true"
      Database__SeedDevelopmentData: "true"
    volumes:
      - api_keys:/home/app/.aspnet
    ports:
      - "127.0.0.1:${API_PORT:-5080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /health/live HTTP/1.0\\r\\n\\r\\n\" >&3; head -n 1 <&3 | grep -q \" 200 \"'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

  web:
    build:
      context: ./frontend/onegov-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"

volumes:
  postgres_data:
  api_keys:
