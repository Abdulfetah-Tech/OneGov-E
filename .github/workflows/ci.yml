name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet tool restore
      - run: dotnet restore OneGov.slnx
      - run: dotnet build OneGov.slnx --no-restore -c Release -p:TreatWarningsAsErrors=true
      - name: Unit tests
        run: dotnet test backend/tests/OneGov.Domain.Tests --no-build -c Release
      - name: Integration tests (Testcontainers needs Docker, available on ubuntu-latest)
        run: dotnet test backend/tests/OneGov.IntegrationTests --no-build -c Release

  frontend:
    if: ${{ hashFiles('frontend/onegov-web/package.json') != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/onegov-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/onegov-web/package-lock.json
      - run: npm ci
      - run: npm run i18n:check
      - run: npm run build
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile -t onegov-api .
      - name: Build web image
        if: ${{ hashFiles('frontend/onegov-web/package.json') != '' }}
        run: docker build -t onegov-web frontend/onegov-web
